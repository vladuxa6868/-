function report(){
  const by={};
  S.recs.filter(r=>r.car===S.cur).forEach(r=>{const y=(r.date||'').slice(0,4)||'без даты',o=by[y]||(by[y]={n:0,e:0,i:0,p:0,w:0}),c=+r.cost||0;o.n++;if(c<0)o.i-=c;else o.e+=c;o.p+=+r.pc||0;o.w+=+r.wc||0});
  const ys=Object.keys(by).sort().reverse(),net=y=>by[y].e-by[y].i,mx=Math.max(1,...ys.map(y=>Math.max(0,net(y)))),E=ys.reduce((a,y)=>a+by[y].e,0),I=ys.reduce((a,y)=>a+by[y].i,0);
  return `<div class="pad"><p class="mute">Чистые расходы</p><h2 class="big">${sgn(E-I)}</h2><p class="mute" style="margin:-8px 0 16px">Расходы ${money(E)}${I?', доходы '+money(I):''}</p>`+ys.map(y=>{const o=by[y];return `<div class="yr"><div class="yh"><b>${y}</b><b>${sgn(net(y))}</b></div><div class="bar2"><i style="width:${Math.round(Math.max(0,net(y))/mx*100)}%"></i></div><p class="mute">Записей: ${o.n}${o.i?', доходы '+money(o.i):''}${o.p>0?', запчасти '+money(o.p):''}${o.w>0?', работа '+money(o.w):''}</p></div>`}).join('')+'</div>';
}
const curKm=c=>Math.max(0,...S.recs.filter(r=>r.car===c).map(r=>+r.km||0));
function oilRems(c){
  const L=S.recs.filter(r=>r.car===c&&r.oil).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(+b.km||0)-(+a.km||0))[0];
  if(!L||!(+L.oilInt>0)||!(+L.km>0))return [];
  const target=+L.km+(+L.oilInt),cur=curKm(c);
  return [{r:L,target,cur,left:target-cur}];
}
function remDue(){
  const t=new Date().toISOString().slice(0,10);let n=0;
  S.cars.forEach(c=>{const km=curKm(c.id);oilRems(c.id).forEach(o=>{if(o.left<=0)n++});(S.rem||[]).forEach(x=>{if(x.car===c.id&&((x.date&&x.date<t)||(x.km&&km>=+x.km)))n++})});
  return n;
}

const SUMX=/^[+\-]?\d+(?:[.,]\d+)?(?:[+\-]\d+(?:[.,]\d+)?)*$/;
function calc(v){

  let t=0;(v.match(/[+\-]?\d+(?:[.,]\d+)?/g)||[]).forEach(x=>{t+=parseFloat(x.replace(',','.'))});
  return Math.round(t*100)/100;
}
const hasOp=v=>/[+\-\u2212]/.test(String(v).trim().replace(/^[+\-\u2212]/,''));

function addOp(id,op){const el=$('#'+id);let v=el.value.trim();if(v===''&&op==='+'){el.focus();return}if(/[+\-\u2212]$/.test(v))v=v.slice(0,-1);el.value=v+op;el.focus();autoSum()}

function pickPhoto(inp,key){

  const u=URL.createObjectURL(f),img=new Image();

    const r=Math.min(1,900/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);
    const d=c.toDataURL('image/jpeg',.65);
    if(key==='att'){attData=d;const p=$('#f-att');p.src=d;p.hidden=false}
    else{photoData=d;$('#f-pic').innerHTML=`<img src="${d}" alt="">`}
  };
  img.onerror=()=>toast('Не удалось открыть фото');
  img.src=u;
}

function swDownH(e){
  if(!e.target||!e.target.closest)return;
  const el=e.target.closest('.rw[data-id]');
  if(swOpen&&!e.target.closest('.del')&&!(el&&el.getAttribute('data-id')===swOpen))closeSw();
  sw=el?{el,x:e.clientX,y:e.clientY,base:el.getAttribute('data-id')===swOpen?-88:0,dx:0,drag:false}:null;
}
function swMoveH(e){
  if(!sw)return false;
  const dx=e.clientX-sw.x,dy=e.clientY-sw.y;
  if(!sw.drag){
    if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)*1.5){sw.drag=true;sw.el.style.webkitTransition=sw.el.style.transition='none';try{sw.el.setPointerCapture(e.pointerId)}catch(_){}}
    else return false;
  }
  sw.dx=Math.max(-88,Math.min(0,sw.base+dx));
  sw.el.style.webkitTransform=sw.el.style.transform='translateX('+sw.dx+'px)';
  return true;
}
function swEnd(){
  if(!sw)return;
  const s=sw;sw=null;
  if(!s.drag)return;
  const open=s.dx<-44;
  setTx(s.el,open?'translateX(-88px)':'','');
  swOpen=open?s.el.getAttribute('data-id'):null;swT=Date.now();
}

async function syncNow(manual){

  syBusy=true;

    await ensure();
    const rows=await api('/rest/v1/journal?select=data,updated_at&limit=1');
    const rem=rows&&rows[0];
    if(!rem){if(S.cars.length||SY.dirty)await push(null)}
    else if(SY.base===rem.updated_at){if(SY.dirty)await push(rem.updated_at)}
    else if(JSON.stringify(rem.data)===JSON.stringify(S)){SY.base=rem.updated_at;SY.dirty=false;sySave()}
    else if(!S.cars.length||(!SY.dirty&&SY.base))pull(rem);

let XL=null;
const COLS=[['date',/^дата/],['km',/пробег|одометр/],['cost',/^итого|стоим|сумм|^цена/],['title',/то и ремонт|бумаг|назван|описан|услуг|что сделано/],['pc',/^запчаст/],['wc',/^работ/],['parts',/артикул/],['notes',/коммент|заметк|примеч/]];
function mapHead(row){
  const used={},m={};
  COLS.forEach(([k,re])=>{m[k]=row.findIndex((h,i)=>!used[i]&&re.test(String(h).trim().toLowerCase()));if(m[k]>=0)used[m[k]]=1});
  return m;
}
function nd(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+432e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  const s=String(v).trim();if(!s)return '';
  let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):'';
}
function nn(v){
  if(typeof v==='number')return v;
  const s=String(v).replace(/[\s\u00a0]/g,'').replace(',','.').replace(/[^\d.\-]/g,'');
  return s&&!isNaN(+s)?+s:'';
}
function parseWb(wb){
  const out=[];
  wb.SheetNames.forEach(name=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
    let m=null;const recs=[];
    rows.forEach(r=>{
      const h=mapHead(r);
      if(h.date>=0&&h.title>=0&&(h.cost>=0||h.km>=0)){m=h;m.doc=/бумаг/i.test(String(r[h.title]));return}
      if(!m)return;
      const g=k=>m[k]>=0?r[m[k]]:'';
      const title=String(g('title')).trim();
      if(!title)return;
      const tot=nn(g('cost')),pc=nn(g('pc')),wc=nn(g('wc'));
      const art=String(g('parts')).trim();
      recs.push({title,date:nd(g('date')),km:nn(g('km')),cost:tot||((+pc||0)+(+wc||0))||'',parts:art?'Артикулы: '+art:'',pc:pc||'',wc:wc||'',kind:m.doc?'doc':'',notes:String(g('notes')).trim()});
    });
    if(recs.length)out.push({name:/^(sheet|лист)\s*\d*$/i.test(name.trim())?'':name.trim(),recs});
  });
  return out;
}

    }catch(e){XL=null;toast('Не удалось прочитать файл');return}
    const box=$('#xl-map');
    if(!XL.length){box.innerHTML='<p class="mute">В файле не нашлась таблица. Нужна строка заголовков со столбцами «Дата» и «ТО и Ремонт» (или «Название»), под ней записи.</p>';return}
    box.innerHTML='<p class="mute">Найдено в файле:</p>'+XL.map(t=>`<p><b>${esc(t.name||'Текущий автомобиль')}</b>: записей ${t.recs.length}</p>`).join('')+'<p class="mute">Одинаковые записи (дата, название, пробег, сумма) повторно не добавятся.</p><div class="row"><button class="btn" onclick="doXl()">Импортировать</button><button class="btn sec" onclick="closeSheet()">Отмена</button></div>';
  };
  fr.onerror=()=>toast('Не удалось прочитать файл');
  fr.readAsArrayBuffer(f);
}
function doXl(){
  snap('до импорта Excel');
  const by={};S.cars.forEach(c=>by[c.name.toLowerCase()]=c.id);
  let n=0,skip=0,first=null;
  XL.forEach(t=>{
    let id;
    if(t.name){const k=t.name.toLowerCase();if(!by[k]){const i=uid();S.cars.push({id:i,name:t.name});by[k]=i}id=by[k]}
    else{if(!S.cur){const i=uid();S.cars.push({id:i,name:'Мой автомобиль'});S.cur=i}id=S.cur}
    if(!first)first=id;
    t.recs.forEach(r=>{
      const ex=S.recs.find(x=>x.car===id&&x.title===r.title&&x.date===r.date&&String(x.cost)===String(r.cost)&&String(x.km)===String(r.km));
      if(ex){ex.pc=r.pc;ex.wc=r.wc;if(r.kind)ex.kind=r.kind;ex.notes=(ex.notes||'').replace(/\n?Запчасти [^\n]*, работа [^\n]*/,'').trim();skip++;return}
      S.recs.push(Object.assign({id:uid(),car:id,photo:null},r));n++;
    });
  });
  if(first)S.cur=first;
  openId=null;save();closeSheet();render();
  const msg='Добавлено записей: '+n+(skip?', обновлено существующих: '+skip:'');
  if(!syOn()){toast(msg+'. Войдите в аккаунт, чтобы записи сохранялись в облаке');return}
  toast(msg+'. Отправляю в облако…');clearTimeout(syT);
  syncNow().then(()=>{if(SY.dirty)syT=setTimeout(()=>syncNow(),3000);toast(msg+(SY.dirty?'. В облако пока не отправлено, повторю позже':'. Сохранено в облаке'))});
}
try{const a=JSON.parse(localStorage.getItem('garage-snaps')||'[]');if(S.recs.length&&(!a[0]||Date.now()-a[0].t>864e5))snap('ежедневная')}catch(e){}
render();
if(syOn()){syncNow();addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()})}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
