const SUMX=/^[+\-]?\d+(?:[.,]\d+)?(?:[+\-]\d+(?:[.,]\d+)?)*$/;
function calc(v){
  v=String(v==null?'':v).replace(/[\s\u00a0]/g,'').replace(/\u2212/g,'-');
  if(v==='')return '';
  if(!SUMX.test(v))return NaN;
  let t=0;(v.match(/[+\-]?\d+(?:[.,]\d+)?/g)||[]).forEach(x=>{t+=parseFloat(x.replace(',','.'))});

  $('#tnbox').hidden=t!=='own';
  const ph={car:'Kia Rio 2018',moto:'Honda CB500',boat:'Yamaha 242',bike:'Trek Marlin',own:'Название'};
  $('#f-car').placeholder=ph[t]||'';
  if(t==='own')setTimeout(()=>{const x=$('#f-tn');if(x)x.focus()},60);
}
function carSheet(id){
  const c=S.cars.find(x=>x.id===id)||{name:''};editing=id||null;carType=c.type||'car';
  sheet(`<h2>${id?'Транспорт':'Новый транспорт'}</h2>
  <div class="vts">${VT.map(t=>`<button class="vt${t[0]===carType?' on':''}" data-t="${t[0]}" onclick="pickType('${t[0]}')">${vb({type:t[0]},44,24)}<span>${t[1]}</span></button>`).join('')}</div>
  <div id="tnbox"${carType==='own'?'':' hidden'}><label>Название вида транспорта<input id="f-tn" value="${esc(c.tn)}" placeholder="Например, Квадроцикл" maxlength="30"></label></div>
  <label>Название<input id="f-car" value="${esc(c.name)}" placeholder="Kia Rio 2018"></label>
  <div class="row"><button class="btn" onclick="saveCar()">Сохранить</button><button class="btn sec" onclick="closeSheet()">Отмена</button></div>
  ${id?`<div class="row"><button class="btn sec dng" onclick="delCar(this)">Удалить и все записи</button></div>`:''}`);
}
function saveCar(){
  const n=$('#f-car').value.trim();
  if(!n){toast('Введите название');return}
  const tn=carType==='own'?$('#f-tn').value.trim():'';
  if(carType==='own'&&!tn){toast('Назовите вид транспорта');return}
  if(editing){const c=S.cars.find(x=>x.id===editing);c.name=n;c.type=carType;c.tn=tn}
  else{const id=uid();S.cars.push({id,name:n,type:carType,tn});S.cur=id}
  save();closeSheet();render();
}
function delCar(b){
  if(delArm!=='car'){delArm='car';b.textContent='Точно удалить? Копия сохранится в автокопиях';return}
  snap('до удаления автомобиля');delArm=null;S.recs=S.recs.filter(r=>r.car!==S.cur);S.cars=S.cars.filter(c=>c.id!==S.cur);
  S.cur=S.cars[0]?S.cars[0].id:null;save();closeSheet();render();
}

function backupSheet(){
  sheet(`<h2>Резервная копия</h2><p class="mute">«Скопировать» и вставьте текст в заметки. Чтобы вернуть данные, вставьте текст в поле и выберите: «Добавить к текущим» объединит записи без дублей, «Заменить» полностью подменит ими текущие. Перед загрузкой приложение само сохранит автокопию.</p>
  <textarea id="f-bk" rows="6">${esc(JSON.stringify(S))}</textarea>
  <div class="row"><button class="btn" onclick="copyBk()">Скопировать</button></div>
  <div class="row"><button class="btn sec" onclick="loadBk('merge')">Добавить к текущим</button><button class="btn sec dng" onclick="loadBk('replace')">Заменить</button></div>`);
}
function copyBk(){
  const t=$('#f-bk');t.select();
  const ok=()=>toast('Скопировано'),fb=()=>{try{document.execCommand('copy');ok()}catch(e){toast('Выделите текст и скопируйте вручную')}};
  try{navigator.clipboard.writeText(t.value).then(ok,fb)}catch(e){fb()}
}
function loadBk(mode){
  try{
    const d=JSON.parse($('#f-bk').value);
    if(!Array.isArray(d.cars)||!Array.isArray(d.recs))throw 0;
    snap('до загрузки резервной копии');
    S=mode==='merge'?merge(S,d):d;
    if(!S.cars.find(c=>c.id===S.cur))S.cur=S.cars[0]?S.cars[0].id:null;
    save();closeSheet();render();toast(mode==='merge'?'Записи добавлены':'Данные заменены');
  }catch(e){toast('Текст не похож на резервную копию')}
}
function snapsSheet(){
  let a=[];try{a=JSON.parse(localStorage.getItem('garage-snaps')||'[]')}catch(e){}
  sheet(`<h2>Автокопии</h2><p class="mute">Перед импортом, загрузкой копии или данных из облака, а также раз в сутки приложение сохраняет копию записей (без фото). При восстановлении фото остаются у тех записей, которые есть сейчас.</p>${a.length?a.map((x,i)=>`<div class="row"><div style="flex:1"><b>${fmtT(x.t)}</b><br><span class="mute">${esc(x.why)}, записей: ${x.n}</span></div><button class="btn sec" style="width:130px" onclick="restoreSnap(${i})">Восстановить</button></div>`).join(''):'<p class="mute">Пока нет копий.</p>'}`);
}
function restoreSnap(i){
  let a=[];try{a=JSON.parse(localStorage.getItem('garage-snaps')||'[]')}catch(e){}
  const x=a[i];if(!x)return;
  const old=S,ph={};old.recs.forEach(r=>{if(r.photo||r.att)ph[r.id]=r});
  snap('до восстановления');
  const d=JSON.parse(x.d);
  d.recs.forEach(r=>{const o=ph[r.id];if(o){r.photo=o.photo;r.att=o.att}});
  S=d;if(!S.cars.find(c=>c.id===S.cur))S.cur=S.cars[0]?S.cars[0].id:null;
  save();closeSheet();render();toast('Восстановлено');
}
function tabsSheet(){
  const on=k=>!(S.tabs&&S.tabs[k]===false);
  sheet(`<h2>Нижнее меню</h2><p class="mute">Вкладка «ТО и Ремонт» показывается всегда, остальные можно скрыть. Записи и напоминания при этом не удаляются. Если оставить только «ТО и Ремонт», нижнее меню исчезнет.</p>${[['doc','Бумаги'],['rem','Напомнить'],['rpt','Отчеты']].map(([k,l])=>`<label class="tg"><span>${l}</span><input type="checkbox" aria-label="${l}"${on(k)?' checked':''} onchange="setTab('${k}',this.checked)"></label>`).join('')}<div class="row"><button class="btn" onclick="closeSheet()">Готово</button></div>`);
}
function setTab(k,v){S.tabs=Object.assign({},S.tabs);S.tabs[k]=v;save();render()}
function moveCar(id,d){
  const i=S.cars.findIndex(c=>c.id===id),j=i+d;
  if(i<0||j<0||j>=S.cars.length)return;
  const t=S.cars[i];S.cars[i]=S.cars[j];S.cars[j]=t;save();render();garageSheet();
}
let XL=null;
const COLS=[['date',/^дата/],['km',/пробег|одометр/],['cost',/^итого|стоим|сумм|^цена/],['title',/то и ремонт|бумаг|назван|описан|услуг|что сделано/],['pc',/^запчаст/],['wc',/^работ/],['parts',/артикул/],['notes',/коммент|заметк|примеч/]];
function mapHead(row){
  const used={},m={};
  COLS.forEach(([k,re])=>{m[k]=row.findIndex((h,i)=>!used[i]&&re.test(String(h).trim().toLowerCase()));if(m[k]>=0)used[m[k]]=1});
  return m;
}
function nd(v){
  if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+432e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
  const s=String(v).trim();if(!s)return '';
  let m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):'';
}
function nn(v){
  if(typeof v==='number')return v;
  const s=String(v).replace(/[\s\u00a0]/g,'').replace(',','.').replace(/[^\d.\-]/g,'');
  return s&&!isNaN(+s)?+s:'';
}
function parseWb(wb){
  const out=[];
  wb.SheetNames.forEach(name=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,raw:true,defval:''});
    let m=null;const recs=[];
    rows.forEach(r=>{
      const h=mapHead(r);
      if(h.date>=0&&h.title>=0&&(h.cost>=0||h.km>=0)){m=h;m.doc=/бумаг/i.test(String(r[h.title]));return}
      if(!m)return;
      const g=k=>m[k]>=0?r[m[k]]:'';
      const title=String(g('title')).trim();
      if(!title)return;
      const tot=nn(g('cost')),pc=nn(g('pc')),wc=nn(g('wc'));
      const art=String(g('parts')).trim();
      recs.push({title,date:nd(g('date')),km:nn(g('km')),cost:tot||((+pc||0)+(+wc||0))||'',parts:art?'Артикулы: '+art:'',pc:pc||'',wc:wc||'',kind:m.doc?'doc':'',notes:String(g('notes')).trim()});
    });
    if(recs.length)out.push({name:/^(sheet|лист)\s*\d*$/i.test(name.trim())?'':name.trim(),recs});
  });
  return out;
}
function xlSheet(){
  if(typeof XLSX==='undefined'){toast('Библиотека Excel не загрузилась. Проверьте интернет и обновите страницу.');return}
  sheet(`<h2>Импорт из Excel</h2><p class="mute">Выберите файл .xlsx, .xls или .csv. Каждый лист станет отдельным автомобилем. Записи добавятся к текущим, ничего не удалится.</p><label>Файл<input type="file" id="f-xl" accept=".xlsx,.xls,.csv" onchange="readXl(this)"></label><div id="xl-map"></div>`);
}
function readXl(inp){
  const f=inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const wb=XLSX.read(new Uint8Array(fr.result),{type:'array'});
      XL=parseWb(wb);
    }catch(e){XL=null;toast('Не удалось прочитать файл');return}
    const box=$('#xl-map');
    if(!XL.length){box.innerHTML='<p class="mute">В файле не нашлась таблица. Нужна строка заголовков со столбцами «Дата» и «ТО и Ремонт» (или «Название»), под ней записи.</p>';return}
    box.innerHTML='<p class="mute">Найдено в файле:</p>'+XL.map(t=>`<p><b>${esc(t.name||'Текущий автомобиль')}</b>: записей ${t.recs.length}</p>`).join('')+'<p class="mute">Одинаковые записи (дата, название, пробег, сумма) повторно не добавятся.</p><div class="row"><button class="btn" onclick="doXl()">Импортировать</button><button class="btn sec" onclick="closeSheet()">Отмена</button></div>';
  };
  fr.onerror=()=>toast('Не удалось прочитать файл');
  fr.readAsArrayBuffer(f);
}
function doXl(){
  snap('до импорта Excel');
  const by={};S.cars.forEach(c=>by[c.name.toLowerCase()]=c.id);
  let n=0,skip=0,first=null;
  XL.forEach(t=>{
    let id;
    if(t.name){const k=t.name.toLowerCase();if(!by[k]){const i=uid();S.cars.push({id:i,name:t.name});by[k]=i}id=by[k]}
    else{if(!S.cur){const i=uid();S.cars.push({id:i,name:'Мой автомобиль'});S.cur=i}id=S.cur}
    if(!first)first=id;
    t.recs.forEach(r=>{
      const ex=S.recs.find(x=>x.car===id&&x.title===r.title&&x.date===r.date&&String(x.cost)===String(r.cost)&&String(x.km)===String(r.km));
      if(ex){ex.pc=r.pc;ex.wc=r.wc;if(r.kind)ex.kind=r.kind;ex.notes=(ex.notes||'').replace(/\n?Запчасти [^\n]*, работа [^\n]*/,'').trim();skip++;return}
      S.recs.push(Object.assign({id:uid(),car:id,photo:null},r));n++;
    });
  });
  if(first)S.cur=first;
  openId=null;save();closeSheet();render();
  const msg='Добавлено записей: '+n+(skip?', обновлено существующих: '+skip:'');
  if(!syOn()){toast(msg+'. Войдите в аккаунт, чтобы записи сохранялись в облаке');return}
  toast(msg+'. Отправляю в облако…');clearTimeout(syT);
  syncNow().then(()=>{if(SY.dirty)syT=setTimeout(()=>syncNow(),3000);toast(msg+(SY.dirty?'. В облако пока не отправлено, повторю позже':'. Сохранено в облаке'))});
}
try{const a=JSON.parse(localStorage.getItem('garage-snaps')||'[]');if(S.recs.length&&(!a[0]||Date.now()-a[0].t>864e5))snap('ежедневная')}catch(e){}
render();
if(syOn()){syncNow();addEventListener('online',()=>syncNow());document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()})}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
</script>
