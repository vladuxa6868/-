<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Журнал ТО">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#4A67E8">

<link rel="icon" type="image/png" href="icon-192.png">
<title>Журнал ремонта</title>
<style>
:root{--bg:#E8EDF0;--card:#fff;--ink:#16252E;--mute:#5E6F79;--line:#C5D0D6;--acc:#0F6E6E;--accink:#fff;--dng:#B3261E;color-scheme:light;box-sizing:border-box;padding-top:0px;padding-bottom:0px}

html{scroll-padding-top:0px}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#111;font:16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:28px;font-weight:800;margin:8px 0 12px}
h2{font-size:20px;font-weight:800;margin:0 0 12px}
h3{font-size:17px;font-weight:600;margin:0}
p{margin:0 0 8px}
.mute{color:#666;font-size:14px}
header{display:-webkit-flex;display:flex;gap:8px;-webkit-align-items:center;align-items:center;margin-bottom:14px}
select,input,textarea{width:100%;font:inherit;font-size:16px;color:#111;background:#fff;border:1px solid #D5D5D5;border-radius:10px;padding:11px 12px}
select{font-weight:600}
textarea{resize:vertical}
label{display:block;font-size:14px;color:#666;margin-bottom:10px}
label input,label textarea{margin-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:inherit;font-weight:600;min-height:46px;padding:0 18px;border:0;border-radius:10px;background:#4A67E8;color:#fff;width:100%;cursor:pointer}
.btn.sec{background:transparent;color:#111;border:1px solid #D5D5D5}
.btn.dng{color:#B3261E}
.link{font:inherit;background:none;border:0;color:#4A67E8;font-weight:600;padding:10px 4px;white-space:nowrap;cursor:pointer}
.row{display:-webkit-flex;display:flex;gap:8px;margin-top:12px}
.sum{display:grid;grid-template-columns:1.3fr 1fr 1fr;border-top:2px solid #111;border-bottom:1px solid #D5D5D5;margin-bottom:14px}
.sum div{padding:12px 8px 12px 0}
.sum div+div{padding-left:10px;border-left:1px solid #D5D5D5}
.sum b{display:block;font-size:19px;font-weight:800;line-height:1.2}
.sum span{font-size:12px;color:#666}
.list{margin-top:14px}
.rec{border-bottom:1px solid #D5D5D5}
.top{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;gap:12px;-webkit-align-items:flex-start;align-items:flex-start;padding:13px 0;cursor:pointer}
.top strong{white-space:nowrap;font-weight:800}
.det{padding:0 0 14px}
.det p{white-space:pre-line}
.det p span{display:block;font-size:12px;color:#666}
.det img,#f-prev{max-width:100%;border-radius:10px;margin:6px 0;display:block}
footer{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:space-between;justify-content:space-between;gap:0 8px;margin-top:24px}
#sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(10,20,26,.55);display:-webkit-flex;display:flex;-webkit-align-items:flex-end;align-items:flex-end;-webkit-justify-content:center;justify-content:center;z-index:20}
#sheet[hidden]{display:none}
.panel{background:#fff;width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + 0px)}
#toast{position:fixed;left:50%;-webkit-transform:translateX(-50%);transform:translateX(-50%);bottom:calc(20px + 0px);background:#111;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
#toast[hidden]{display:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #4A67E8;outline-offset:2px}

:root{--bg:#fff;--card:#fff;--ink:#111;--mute:#666;--line:#D5D5D5;--acc:#4A67E8;--accink:#fff;--dng:#B3261E;--grn:#1B9E3C;--km:#4458C7;--chip:#E3E3E3;--chipink:#1A1A1A;--chipsel:#D9E0FF;--chipselink:#2B3FA8;--nav:#F1F1F5}

#app{max-width:560px;padding:0 0 150px}
.pad{padding:0 16px}
.ttl{margin:24px 0 12px}
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:2px;padding:10px 10px 6px}
.bar h1{-webkit-flex:1;flex:1;margin:0 0 0 8px;font-size:22px;font-weight:800}
.ib{background:none;border:0;color:#111;padding:8px;display:-webkit-flex;display:flex;cursor:pointer}
.chips{display:-webkit-flex;display:flex;gap:10px;overflow-x:auto;padding:8px 16px 14px}
.chip{-webkit-flex:none;flex:none;font:inherit;font-size:16px;border:0;border-radius:20px;padding:11px 20px;background:#E3E3E3;color:#1A1A1A;cursor:pointer}
.chip.on{background:#D9E0FF;color:#2B3FA8}
.q{display:block;margin:0 16px 8px;width:calc(100% - 32px)}
.rec{position:relative;border-bottom:0}
.rec::after{content:"";position:absolute;left:90px;right:0;bottom:0;border-bottom:1px solid #D5D5D5}
.rw{display:grid;grid-template-columns:62px 88px 1fr auto;gap:10px;-webkit-align-items:center;align-items:center;padding:12px 16px 12px 14px;cursor:pointer}
.th{width:62px;height:62px;border-radius:14px;object-fit:cover;background:#fff;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center}
.dt b{display:block;font-size:15px;font-weight:800}
.dt i{display:block;font-style:normal;font-size:14px;font-weight:600;color:#4458C7}
.tt{font-size:16px;line-height:1.25;min-width:0;overflow-wrap:anywhere}
.am{text-align:right;white-space:nowrap}
.am b{display:block;font-size:18px;font-weight:800;color:#1B9E3C}
.am span{display:-webkit-flex;display:flex;gap:4px;-webkit-justify-content:flex-end;justify-content:flex-end;-webkit-align-items:center;align-items:center;font-size:14px;color:#666}
.rm{grid-template-columns:62px 1fr auto;cursor:default}
.rm .tt b{display:block}
.det{padding:0 16px 16px}
#nav{position:fixed;left:0;right:0;bottom:0;display:-webkit-flex;display:flex;background:#F1F1F5;padding:8px 0 calc(8px + 0px);z-index:10}
#nav button{-webkit-flex:1;flex:1;background:none;border:0;color:#666;font:inherit;font-size:12px;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;gap:2px;cursor:pointer}
#nav button.on{color:#4A67E8;font-weight:600}
#fab{position:fixed;right:16px;bottom:calc(84px + 0px);width:62px;height:62px;border-radius:18px;border:0;background:#4A67E8;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:11;cursor:pointer}
#nav[hidden],#fab[hidden]{display:none}
.big{font-size:34px;margin:0 0 16px}
.yr{margin-bottom:16px}
.yh{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between}
.bar2{height:8px;background:#D5D5D5;border-radius:4px;margin:6px 0}
.bar2 i{display:block;height:100%;background:#1B9E3C;border-radius:4px}

#sheet.full{background:#fff;display:block;overflow:auto}
#sheet.full[hidden]{display:none}
.page{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(40px + 0px)}
.fbar{position:sticky;top:0;z-index:2;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;gap:6px;background:#F1F1F5;padding:calc(12px + 0px) 12px 12px}
.fbar h2{-webkit-flex:1;flex:1;margin:0 0 0 8px;font-size:22px}
.fc{background:#F1F1F1;border-radius:28px;margin:14px 14px 0;padding:18px 20px 14px}

:root[data-theme="dark"] .fc{background:#D7D7D7}
.fc h3{color:#1B9E3C;font-size:19px;font-weight:800;margin:0 0 6px}
.fc.g{--fl:#1B9E3C}
.fc.n{--fl:#666}
.pic{width:112px;height:112px;border-radius:26px;background:#fff;margin:6px auto 18px;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.pill{display:block;margin:0 auto 14px;font:inherit;font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:#111;background:none;border:1px solid #666;border-radius:28px;padding:14px 26px;cursor:pointer}
.pill.l{margin:10px 0 6px}
.mf{position:relative}
.mf input,.mf textarea{display:block;width:100%;min-height:64px;background:transparent;border:0;border-bottom:1.5px solid #4458C7;border-radius:0;padding:28px 16px 10px;font-size:18px;color:#111;-webkit-appearance:none;appearance:none}
.mf span{position:absolute;left:16px;top:22px;font-size:18px;color:#666;pointer-events:none;-webkit-transition:top .15s,font-size .15s;transition:top .15s,font-size .15s}
.mf input:focus+span,.mf input:not(:placeholder-shown)+span,.mf textarea:focus+span,.mf textarea:not(:placeholder-shown)+span,.mf.up span{top:8px;font-size:13px}
.cnt{text-align:right;font-size:14px;color:#4458C7;padding:4px 16px 10px}
.fc.n .cnt{color:#666}
#f-att{max-width:100%;max-height:160px;border-radius:12px;margin:8px 0}

.sw{position:relative;overflow:hidden}
.del{position:absolute;top:0;right:0;bottom:0;width:88px;border:0;background:#E5484D;color:#fff;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;cursor:pointer}
.sw .rw{position:relative;background:#fff;-webkit-transition:-webkit-transform .2s;transition:transform .2s;touch-action:pan-y;-webkit-user-select:none;-webkit-user-select:none;user-select:none}
#toast .link{color:inherit;text-decoration:underline;padding:0 0 0 10px}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
#app{position:fixed;top:0;bottom:0;left:0;right:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:0px 0 calc(150px + 0px)}
.btn:disabled{opacity:.35}
.tg{display:-webkit-flex;display:flex;-webkit-justify-content:space-between;justify-content:space-between;-webkit-align-items:center;align-items:center;font-size:17px;color:#111;padding:12px 0;margin:0;border-bottom:1px solid #D5D5D5}
.tg input{-webkit-appearance:none;appearance:none;width:52px;height:30px;margin:0;padding:0;border:0;border-radius:15px;background:#D5D5D5;position:relative;-webkit-transition:background .2s;transition:background .2s;-webkit-flex:none;flex:none;cursor:pointer}
.tg input::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;-webkit-transition:left .2s;transition:left .2s}
.tg input:checked{background:#4A67E8}
.tg input:checked::after{left:25px}
.am b.inc{color:#4A67E8}




.hd{position:sticky;top:0;z-index:5;background:#fff;padding-top:0px}
#app{padding-top:0}
#app>.pad{padding-top:calc(12px + 0px)}
@media (max-width:359px){
.rw{grid-template-columns:40px 72px 1fr auto;gap:8px;padding:10px 8px}
.th{width:40px;height:40px;border-radius:10px}

.dt b{font-size:12px}.dt i{font-size:11px}
.tt{font-size:13px}
.am b{font-size:14px}.am span{font-size:11px}
.rec::after{left:56px}
.bar h1{font-size:17px;white-space:nowrap}
.ib{padding:6px}
.ib svg{width:22px;height:22px}
#nav button{font-size:10.5px;white-space:nowrap}
#nav button svg{width:22px;height:22px}
.chip{padding:9px 14px;font-size:15px}
.fc{margin:12px 10px 0;padding:16px 14px 10px}
.rm{grid-template-columns:44px 1fr auto}
}
#nav button{position:relative}
.dot{position:absolute;top:2px;left:50%;margin-left:7px;width:10px;height:10px;border-radius:50%;background:#E5484D;border:2px solid #F1F1F5}
.seg{display:-webkit-flex;display:flex;margin:0 0 8px;border:1px solid #D5D5D5;border-radius:24px;overflow:hidden}
.seg button{-webkit-flex:1;flex:1;background:none;border:0;padding:12px 8px;font:inherit;font-size:15px;color:#111;cursor:pointer}
.seg button.on{background:#4A67E8;color:#fff;font-weight:600}
.mf.amt input{padding-right:88px}
.ops{position:absolute;right:4px;top:18px;display:-webkit-flex;display:flex}
.plusb{width:36px;height:36px;margin-left:6px;border-radius:18px;border:1px solid #D5D5D5;background:none;color:#111;font-size:20px;line-height:1;padding:0;cursor:pointer}
.eq{font-size:13px;color:#1B9E3C;padding:2px 16px 4px}
.eq:empty{display:none}


.rw{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;padding:12px 12px}
.rw>*{margin-right:10px}
.rw>*:last-child{margin-right:0}
.th{-webkit-flex:none;flex:none}
.dt{width:88px;-webkit-flex:none;flex:none}

.am{-webkit-flex:none;flex:none}
.rm .tt{-webkit-flex:1;flex:1}
.two{display:-webkit-flex;display:flex}
.two>*{-webkit-flex:1;flex:1;min-width:0}
.two>*+*{margin-left:10px}
.row>*+*{margin-left:8px}
.chips>*+*{margin-left:10px}
.fbar>*+*{margin-left:6px}
.bar>*+*{margin-left:2px}
.am span svg{margin-right:4px}
.mf span{top:8px;font-size:13px}
.fc.g .mf input{border-bottom-color:#1B9E3C}
.fc.g .cnt{color:#1B9E3C}
.fc.n .mf input{border-bottom-color:#666}
.hd{position:fixed;top:0;left:0;right:0;z-index:5}
.fbar{position:static}
#nav button span{margin-top:2px}
@media (max-width:359px){
.th{width:40px;height:40px}
.dt{width:72px}
.rw{padding:10px 8px}
.rw>*{margin-right:8px}
.rw>*:last-child{margin-right:0}
}
</style>
